<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-pressed]="isDark"
  aria-label="Toggle dark theme"
  title="Toggle dark theme"
>
  <!-- прості SVG-іконки: сонце/місяць -->
  <span class="icon" [class.hide]="isDark" aria-hidden="true">
    <!-- sun -->
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5 5L3.6 3.6M20.4 20.4L19 19M5 19l-1.4 1.4M20.4 3.6L19 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="4" fill="currentColor"/>
    </svg>
  </span>
  <span class="icon" [class.hide]="!isDark" aria-hidden="true">
    <!-- moon -->
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
    </svg>
  </span>
</button>
