<md-card>
  <md-card-content>
    <h2 class="example-h2">Slide toggle configuration</h2>

    <section class="example-section">
      <md-checkbox class="example-margin" [(ngModel)]="checked">Checked</md-checkbox>
    </section>

    <section class="example-section">
      <md-checkbox class="example-margin" [(ngModel)]="disabled">Disabled</md-checkbox>
    </section>
  </md-card-content>
</md-card>

<md-card class="result">
  <md-card-content>
    <h2 class="example-h2">Result</h2>

    <section class="example-section">
      <md-switch
          class="example-margin"
          [(ngModel)]="checked"
          [disabled]="disabled">
        Slide me!
      </md-switch>
    </section>
  </md-card-content>
</md-card>
